<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlacaFIPE — Consulta Veicular</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 8px;
      color: #64748b;
      font-size: 0.95rem;
    }

    .card {
      background: #1e2433;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f1117;
      border: 1.5px solid #2d3748;
      border-radius: 10px;
      padding: 14px 18px;
      color: #e2e8f0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
    }

    input[type="text"]::placeholder {
      color: #4a5568;
      letter-spacing: 1px;
      font-weight: 400;
    }

    button#btn-consultar {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button#btn-consultar:hover { opacity: 0.88; }
    button#btn-consultar:active { transform: scale(0.97); }
    button#btn-consultar:disabled { opacity: 0.4; cursor: not-allowed; }

    .hint {
      font-size: 0.8rem;
      color: #4a5568;
      margin-bottom: 24px;
    }

    /* Loading */
    .loader {
      display: none;
      text-align: center;
      padding: 28px 0;
      color: #64748b;
      font-size: 0.9rem;
    }

    .loader .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2d3748;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result */
    .result { display: none; }

    .placa-badge {
      text-align: center;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #f1f5f9;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #3b82f6;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2d3748;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .field {
      background: #0f1117;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .field .label {
      font-size: 0.72rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .field .value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .fipe-box {
      background: linear-gradient(135deg, #1a2744, #1e1a35);
      border: 1px solid #3b82f620;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .fipe-valor {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .fipe-meta {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }

    .fonte {
      font-size: 0.75rem;
      color: #4a5568;
      text-align: center;
      margin-top: 4px;
    }

    .fonte a { color: #3b82f6; text-decoration: none; }
    .fonte a:hover { text-decoration: underline; }

    /* Error */
    .error-box {
      display: none;
      background: #2d1515;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 16px 18px;
      color: #fca5a5;
      font-size: 0.9rem;
    }

    .history {
      width: 100%;
      max-width: 560px;
      margin-top: 24px;
    }

    .history h3 {
      font-size: 0.8rem;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      background: #1e2433;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .history-item:hover { border-color: #3b82f6; color: #3b82f6; }
  </style>
</head>
<body>

<header>
  <h1>🚗 PlacaFIPE</h1>
  <p>Consulta veicular — Detran + Tabela FIPE</p>
</header>

<div class="card">
  <div class="input-group">
    <input type="text" id="placa" placeholder="ABC1234 ou ABC1D23" maxlength="7" autocomplete="off" />
    <button id="btn-consultar" onclick="consultar()">Consultar</button>
  </div>
  <p class="hint">Suporta placas antigas (ABC1234) e Mercosul (ABC1D23)</p>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    Consultando placafipe.com...
  </div>

  <div class="error-box" id="error-box"></div>

  <div class="result" id="result">
    <div class="placa-badge" id="res-placa"></div>

    <p class="section-label">Dados do Veículo</p>
    <div class="fields">
      <div class="field"><div class="label">Marca</div><div class="value" id="res-marca"></div></div>
      <div class="field"><div class="label">Modelo</div><div class="value" id="res-modelo"></div></div>
      <div class="field"><div class="label">Ano</div><div class="value" id="res-ano"></div></div>
      <div class="field"><div class="label">Cor</div><div class="value" id="res-cor"></div></div>
      <div class="field"><div class="label">Combustível</div><div class="value" id="res-combustivel"></div></div>
      <div class="field"><div class="label">Potência</div><div class="value" id="res-potencia"></div></div>
      <div class="field"><div class="label">UF</div><div class="value" id="res-uf"></div></div>
      <div class="field"><div class="label">Município</div><div class="value" id="res-municipio"></div></div>
      <div class="field"><div class="label">Chassi</div><div class="value" id="res-chassi"></div></div>
      <div class="field"><div class="label">Importado</div><div class="value" id="res-importado"></div></div>
    </div>

    <p class="section-label">Tabela FIPE</p>
    <div class="fipe-box">
      <div class="fipe-valor" id="res-valor"></div>
      <div class="fipe-meta" id="res-fipe-meta"></div>
    </div>

    <div class="fonte">Fonte: <a id="res-fonte-link" href="#" target="_blank">placafipe.com</a></div>
  </div>
</div>

<div class="history" id="history-section" style="display:none">
  <h3>Consultas recentes</h3>
  <div class="history-list" id="history-list"></div>
</div>

<script>
  const input = document.getElementById('placa');
  const btn = document.getElementById('btn-consultar');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') consultar(); });
  input.addEventListener('input', () => {
    input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  async function consultar() {
    const placa = input.value.trim();
    if (!placa) return;

    show('loader');
    btn.disabled = true;

    try {
      const res = await fetch(`/placa/${placa}`);
      const json = await res.json();

      if (!json.success) throw new Error(json.error);

      const d = json.data;
      document.getElementById('res-placa').textContent = d.placa;
      document.getElementById('res-marca').textContent = d.marca;
      document.getElementById('res-modelo').textContent = d.modelo;
      document.getElementById('res-ano').textContent = d.ano;
      document.getElementById('res-cor').textContent = d.cor;
      document.getElementById('res-combustivel').textContent = d.combustivel;
      document.getElementById('res-potencia').textContent = d.potencia;
      document.getElementById('res-uf').textContent = d.uf;
      document.getElementById('res-municipio').textContent = d.municipio;
      document.getElementById('res-chassi').textContent = d.chassi;
      document.getElementById('res-importado').textContent = d.importado;
      document.getElementById('res-valor').textContent = d.valorFipe;
      document.getElementById('res-fipe-meta').textContent =
        `Cód. ${d.codigoFipe} · ${d.modeloFipe}`;
      const link = document.getElementById('res-fonte-link');
      link.href = d.fonte;
      link.textContent = d.fonte;

      addHistory(placa);
      show('result');
    } catch (e) {
      document.getElementById('error-box').textContent = '❌ ' + e.message;
      show('error-box');
    } finally {
      btn.disabled = false;
    }
  }

  function show(id) {
    ['loader','result','error-box'].forEach(i => {
      document.getElementById(i).style.display = i === id ? (i === 'error-box' ? 'block' : i === 'result' ? 'block' : 'flex') : 'none';
    });
    if (id === 'loader') document.getElementById('loader').style.display = 'block';
  }

  function addHistory(placa) {
    let h = JSON.parse(localStorage.getItem('placas') || '[]');
    h = [placa, ...h.filter(p => p !== placa)].slice(0, 8);
    localStorage.setItem('placas', JSON.stringify(h));
    renderHistory();
  }

  function renderHistory() {
    const h = JSON.parse(localStorage.getItem('placas') || '[]');
    const sec = document.getElementById('history-section');
    const list = document.getElementById('history-list');
    if (!h.length) { sec.style.display = 'none'; return; }
    sec.style.display = 'block';
    list.innerHTML = h.map(p =>
      `<div class="history-item" onclick="loadPlaca('${p}')">${p}</div>`
    ).join('');
  }

  function loadPlaca(p) {
    input.value = p;
    consultar();
  }

  renderHistory();
</script>
</body>
</html>
